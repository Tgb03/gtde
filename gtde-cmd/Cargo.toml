[package]
name = "gtde-cmd"
version.workspace = true
edition = "2024"

[dependencies]
gtde-db = { path = "../gtde-db" }
gtde-error = { path = "../gtde-error" }
gtde-file = { path = "../gtde-file" }
serde = { workspace = true }
clap = { version = "4.5.61", features = ["derive"] }
serde_json = { workspace = true }
thiserror = "2.0.18"
colored = "3.1.1"
include_dir = "0.7.4"
textwrap = "0.16.2"

[dev-dependencies]
tempfile = "3"

[lib]
name = "gtde_cmd"
path = "src/lib.rs"
